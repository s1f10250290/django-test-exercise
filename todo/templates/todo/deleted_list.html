{% load static %}
<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deleted Tasks</title>
    <link rel="stylesheet" href="{% static 'todo/css/deleted.css' %}">
</head>
<body>
    <div class="page">
        <div class="header">
            <div>
                <p class="eyebrow">Archive</p>
                <h1>Deleted Tasks</h1>
            </div>
            <a class="back-link" href="{% url 'index' %}">Back to Active Tasks</a>
        </div>

        {% if tasks %}
            <ul class="task-list">
                {% for task in tasks %}
                    <li class="task-item">
                        <div class="task-content">
                            <strong>{{ task.title }}</strong>
                            {% if task.due_at %}
                                <span class="due-date">Due: {{ task.due_at }}</span>
                            {% endif %}
                        </div>
                        <a class="view-link" href="{% url 'detail' task.id %}">View</a>
                    </li>
                {% endfor %}
            </ul>
        {% else %}
            <p class="empty-state">No deleted tasks</p>
        {% endif %}
    </div>
</body>
</html>
